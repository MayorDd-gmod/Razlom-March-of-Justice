<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Razlom: March of Justice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="tree-container">
    <h2>Структура Подразделений</h2>
    <ul class="tree-list">
      
      <!-- Пункт 1: Штаб (раскрывающийся) -->
      <li class="tree-item has-children expanded">
        <div class="item-content">
          <img src="images/icon-hq.png" alt="Штаб" class="item-icon">
          <span>Штаб Операций</span>
          <span class="toggle-btn">▼</span>
        </div>
        <ul class="sub-tree">
          <li class="tree-item">
            <div class="item-content">
              <img src="images/icon-252.png" alt="252-ГвМСП" class="item-icon">
              <span>252-ГвМСП</span>
            </div>
          </li>
          <li class="tree-item">
            <div class="item-content">
              <img src="images/icon-spetsnaz.png" alt="Спецназ" class="item-icon">
              <span>Спецназ "Гром"</span>
            </div>
          </li>
        </ul>
      </li>

      <!-- Пункт 2: ФСБ -->
      <li class="tree-item">
        <div class="item-content">
          <img src="images/icon-fsb.png" alt="ФСБ" class="item-icon">
          <span>Управление ФСБ по региону</span>
        </div>
      </li>

    </ul>
  </div>

  <script>
    const items = document.querySelectorAll('.tree-item.has-children');
    items.forEach(item => {
      const btn = item.querySelector('.toggle-btn');
      btn.addEventListener('click', () => {
        item.classList.toggle('expanded');
        item.classList.toggle('collapsed');
      });
    });
  </script>
</body>
</html>
